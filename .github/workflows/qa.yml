name: qa
on:
  push:
  pull_request:
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse cards and run content QA
        run: node tools/qa-content.js
